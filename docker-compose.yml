services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fortios-upgrade-intelligence:local
    restart: unless-stopped
    depends_on:
      cert-helper:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      FORTIOS_TLS_CERT: ${FORTIOS_TLS_CERT:-}
      FORTIOS_TLS_KEY: ${FORTIOS_TLS_KEY:-}
      FORTIOS_TLS_HOSTNAME: ${FORTIOS_TLS_HOSTNAME:-}
      FORTIOS_CERT_ADMIN_FILE: ${FORTIOS_CERT_ADMIN_FILE:-/opt/fortios/certificates/admin/credentials.json}
      FORTIOS_CERT_HELPER_SOCKET: /run/fortios-cert-helper/helper.sock
      FORTIOS_CONTAINER_HEALTHCHECK: "1"
    ports:
      - "${FORTIOS_HTTP_BIND_ADDRESS:-127.0.0.1}:${FORTIOS_HTTP_PORT:-8000}:8000"
    volumes:
      - ${FORTIOS_DATA_DIR:-./data}:/opt/fortios/data
      - ${FORTIOS_DOCS_DIR:-./docs}:/opt/fortios/docs
      - ${FORTIOS_CERTS_DIR:-./certificates}:/opt/fortios/certificates:ro
      - fortios-cert-helper-run:/run/fortios-cert-helper:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  cert-helper:
    build:
      context: .
      dockerfile: Dockerfile
    image: fortios-upgrade-intelligence:local
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/fortios-cert-helper-entrypoint"]
    network_mode: none
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      FORTIOS_TLS_HOSTNAME: ${FORTIOS_TLS_HOSTNAME:-}
      FORTIOS_CERT_ADMIN_FILE: ${FORTIOS_CERT_ADMIN_FILE:-/opt/fortios/certificates/admin/credentials.json}
      FORTIOS_CERT_OUTPUT_DIR: /opt/fortios/certificates/active
      FORTIOS_CERT_HELPER_SOCKET: /run/fortios-cert-helper/helper.sock
    volumes:
      - ${FORTIOS_CERTS_DIR:-./certificates}:/opt/fortios/certificates
      - fortios-cert-helper-run:/run/fortios-cert-helper
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "scripts/cert_helper.py", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  scheduler:
    image: fortios-upgrade-intelligence:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "scripts/container_scheduler.py"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      FORTIOS_RUN_ON_START: ${FORTIOS_RUN_ON_START:-0}
      FORTIOS_EMAIL_ENABLED: ${FORTIOS_EMAIL_ENABLED:-false}
      FORTIOS_SMTP_HOST: ${FORTIOS_SMTP_HOST:-}
      FORTIOS_SMTP_PORT: ${FORTIOS_SMTP_PORT:-587}
      FORTIOS_SMTP_USERNAME: ${FORTIOS_SMTP_USERNAME:-}
      FORTIOS_SMTP_PASSWORD_FILE: ${FORTIOS_SMTP_PASSWORD_FILE:-}
      FORTIOS_SMTP_STARTTLS: ${FORTIOS_SMTP_STARTTLS:-true}
      FORTIOS_SMTP_TIMEOUT: ${FORTIOS_SMTP_TIMEOUT:-10}
      FORTIOS_SMTP_FROM: ${FORTIOS_SMTP_FROM:-}
      FORTIOS_SMTP_TO: ${FORTIOS_SMTP_TO:-}
      FORTIOS_APP_URL: ${FORTIOS_APP_URL:-}
    volumes:
      - ${FORTIOS_DATA_DIR:-./data}:/opt/fortios/data
      - ${FORTIOS_DOCS_DIR:-./docs}:/opt/fortios/docs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true

volumes:
  fortios-cert-helper-run:
