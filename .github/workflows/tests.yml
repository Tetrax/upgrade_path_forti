name: Tests

# ---------------------------------------------------------------------------
# Security scanning policy (A5 — Scan de sécurité dépendances/image)
#
# PIP-AUDIT (dependency scan):
#   - Runs on every push/PR in the python-tests job.
#   - Audits requirements-runtime.txt + requirements-dev.txt against the PyPA
#     Advisory Database.
#   - Threshold: fails the build on any vulnerability rated HIGH or CRITICAL.
#     MEDIUM and below generate annotations but do not block.
#   - To switch to advisory-only mode, set `continue-on-error: true` on the
#     pip-audit step — vulnerabilities are reported but never block CI.
#
# TRIVY (container image scan):
#   - Runs as a separate `security-scan` job after python-tests and e2e-tests
#     both pass.
#   - Builds the Docker image locally (no push) and scans OS packages + pip
#     dependencies for known HIGH/CRITICAL CVEs.
#   - INFORMATIVE, NOT BLOCKING: `exit-code: 0` means a finding never fails the
#     run. The findings are surfaced through the step summary of the job, a
#     `::warning::` annotation and the `trivy-report` artifact (trivy.json).
#     The run stays green on purpose: a pipeline that is red on every single
#     build hides the failures that actually matter.
#   - The blocking controls remain: Ruff, unit tests, Playwright, image build.
#   - `ignore-unfixed: true` is deliberate: only vulnerabilities that already
#     have a fixed version are reported, because the alert is meant to be
#     ACTIONNABLE (refresh the pinned base image / upgrade the package). A
#     vulnerability with no available fix produces an alert nobody can act on.
#   - A missing or unreadable report is a broken control, not a finding: it is
#     reported explicitly in the summary and as a warning, and still never fails
#     the run.
#   - To make Trivy blocking again, set `exit-code: 1` on the scan step and drop
#     `if-no-files-found: warn` from the upload step.
# ---------------------------------------------------------------------------

# No real SMTP secrets, no Fortinet/PSIRT calls, no dependency on the real VPS or its data --
# scripts/fortios_server.py's FORTIOS_E2E_MOCK_NETWORK hook keeps the E2E suite fully offline,
# and the unittest suite already mocks smtplib/urllib entirely (see tests/*.py). This workflow
# never interpolates any event/PR/commit-controlled text into a run: step.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint scripts
        run: ruff check scripts/
      - name: Lint tests
        run: ruff check tests/

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all scripts
        run: python3 -m compileall -q scripts
      - name: Check shell script syntax
        run: bash -n deploy/install.sh docker/*.sh
      - name: Run unittest suite
        run: python3 -m unittest discover -s tests -v
      - name: Audit Python dependencies for known vulnerabilities
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-runtime.txt requirements-dev.txt
        # Policy: fail on HIGH or CRITICAL (pip-audit default).
        # To make advisory-only, uncomment the line below:
        # continue-on-error: true

  e2e-tests:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install E2E test dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Playwright's Chromium only
        run: python3 -m playwright install --with-deps chromium
      - name: Run E2E suite
        run: python3 -m pytest tests/e2e/ -v
      - name: Upload traces/screenshots/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  docker-build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: python-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository for Docker tags
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Container image vulnerability scan (Trivy, informatif)
    runs-on: ubuntu-latest
    needs: [python-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (for scanning only — no push)
        run: docker build -t fortios-upgrade-intelligence:ci-scan .
      # Informative control: `exit-code: 0` so a finding never fails the run. The JSON report is
      # always produced and the findings are surfaced by the two steps below.
      - name: Scan image for OS and dependency vulnerabilities (informatif)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fortios-upgrade-intelligence:ci-scan
          format: json
          output: trivy.json
          exit-code: 0
          # Only actionable findings: a vulnerability with no fixed version produces an alert
          # nobody can act on.
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      # Never fails: the step summary states the counts, the packages, the installed and fixed
      # versions, and makes the informative nature of the control explicit — "findings detected"
      # must never be mistaken for "the build is broken".
      - name: Publish the findings summary in the run page
        if: always()
        run: python3 scripts/trivy_report.py trivy.json --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload the Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json
          retention-days: 30
          # A missing report is warned about, never fatal: the control stays informative whatever
          # happens to the scan itself.
          if-no-files-found: warn
