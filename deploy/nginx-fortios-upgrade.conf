# FortiOS Upgrade Intelligence — reverse proxy HTTPS de référence (fortiupgrade.valdev.me)
#
# Modèle du vhost actif du VPS (/etc/nginx/sites-available/fortiupgrade.valdev.me), devant la
# stack Docker publiée sur 127.0.0.1:8000. La paire TLS est celle activée par le helper de
# certificats (docs/certificates.md), jamais une paire posée à la main.
#
# La liste d'IP autorisées n'est pas dans ce fichier : elle est appliquée globalement par
# /etc/nginx/conf.d/00-application-access.conf (allow ...; deny all;), hors dépôt.
server {
    server_name fortiupgrade.valdev.me;

    # Covers both 12 MiB advisory image bodies and the 56 MiB upper bound for
    # base64-encoded certificate/key/chain uploads. The application enforces the
    # narrower per-route limits before decoding or persisting any payload.
    client_max_body_size 56m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Preserve the external authority (including any non-standard port) so
        # Origin/Referer checks see exactly what the browser sent.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        # This is the trust-boundary proxy: overwrite any client-supplied chain.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate     /var/lib/fortiupgrade/certificates/active/fullchain.pem;
    ssl_certificate_key /var/lib/fortiupgrade/certificates/active/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = fortiupgrade.valdev.me) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name fortiupgrade.valdev.me;
    return 404;
}
