# FortiOS Upgrade Intelligence — HTTPS sur port 3001
server {
    listen 3001 ssl;
    server_name valdev.me www.valdev.me;

    ssl_certificate     /etc/letsencrypt/live/valdev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valdev.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Covers both 12 MiB advisory image bodies and the 56 MiB upper bound for
    # base64-encoded certificate/key/chain uploads. The application enforces the
    # narrower per-route limits before decoding or persisting any payload.
    client_max_body_size 56m;

    # IP whitelist
    allow 5.226.1.2;
    allow 78.153.228.169;
    allow 86.193.239.40;
    allow 94.187.154.52;
    allow 145.224.117.202;
    allow 192.214.195.228;
    allow 185.48.254.148;
    allow 82.65.93.32;
    allow 193.251.27.103;
    allow 37.110.194.49;
    allow 185.135.177.254;
    allow 23.90.254.227;
    allow 85.31.217.44;
    deny  all;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Preserve a non-standard external port so Origin/Referer checks see
        # exactly the authority sent by the browser.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        # This is the trust-boundary proxy: overwrite any client-supplied chain.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
