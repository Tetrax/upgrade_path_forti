# Portainer / offline import variant with absolute host paths.
# Load fortios-upgrade-intelligence:local first, then deploy this file as a Stack.
services:
  web:
    image: ghcr.io/tetrax/upgrade_path_forti:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      FORTIOS_TLS_CERT: ${FORTIOS_TLS_CERT:-}
      FORTIOS_TLS_KEY: ${FORTIOS_TLS_KEY:-}
      FORTIOS_TLS_HOSTNAME: ${FORTIOS_TLS_HOSTNAME:-}
      FORTIOS_CONTAINER_HEALTHCHECK: "1"
    ports:
      - "${FORTIOS_HTTP_BIND_ADDRESS:-127.0.0.1}:${FORTIOS_HTTP_PORT:-8000}:8000"
    volumes:
      - ${FORTIOS_DATA_DIR}:/opt/fortios/data
      - ${FORTIOS_DOCS_DIR}:/opt/fortios/docs
      - ${FORTIOS_CERTS_DIR}:/opt/fortios/certificates
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  scheduler:
    image: ghcr.io/tetrax/upgrade_path_forti:latest
    restart: unless-stopped
    command: ["python", "scripts/container_scheduler.py"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      FORTIOS_RUN_ON_START: ${FORTIOS_RUN_ON_START:-0}
      FORTIOS_EMAIL_ENABLED: ${FORTIOS_EMAIL_ENABLED:-false}
      FORTIOS_SMTP_HOST: ${FORTIOS_SMTP_HOST:-}
      FORTIOS_SMTP_PORT: ${FORTIOS_SMTP_PORT:-587}
      FORTIOS_SMTP_USERNAME: ${FORTIOS_SMTP_USERNAME:-}
      FORTIOS_SMTP_PASSWORD_FILE: ${FORTIOS_SMTP_PASSWORD_FILE:-}
      FORTIOS_SMTP_STARTTLS: ${FORTIOS_SMTP_STARTTLS:-true}
      FORTIOS_SMTP_TIMEOUT: ${FORTIOS_SMTP_TIMEOUT:-10}
      FORTIOS_SMTP_FROM: ${FORTIOS_SMTP_FROM:-}
      FORTIOS_SMTP_TO: ${FORTIOS_SMTP_TO:-}
      FORTIOS_APP_URL: ${FORTIOS_APP_URL:-}
    volumes:
      - ${FORTIOS_DATA_DIR}:/opt/fortios/data
      - ${FORTIOS_DOCS_DIR}:/opt/fortios/docs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
